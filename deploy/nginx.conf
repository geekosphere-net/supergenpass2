server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS when you have a cert
    # return 301 https://$host$request_uri;

    root /var/www/supergenpass2;
    index index.html;

    # Security headers — tighter than GitHub Pages allows
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # All JS and CSS are inlined; only self-fetches (bookmarklet update check) need connect-src
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Block access to source/build tooling — not needed at runtime
    location ~ ^/(src|grunt|test|node_modules|build)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}

